<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2a44">
<title>Floorball Kupa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: egyoszlopos telefonos nézet – élő sáv a tetején, alatta ragadós fül-sáv (Meccsek / Tabellák / Végeredmény). */
:root {
  --bg: #eef2f6;          /* csarnokpadló, hideg világos */
  --surface: #ffffff;
  --ink: #0f2a44;         /* palánk-sötétkék */
  --muted: #5d7186;
  --line: #d5dee8;
  --accent: #e8571c;      /* floorball-labda narancs */
  --accent-ink: #ffffff;
  --win: #1d7a4c;
  --soft: #e3eaf2;
  --mine: #fff1e8;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1724; --surface: #12233a; --ink: #e8eef5; --muted: #93a6ba; --line: #22374f;
    --accent: #ff7a3d; --accent-ink: #1a0d05; --win: #4cc48a; --soft: #1a2f49; --mine: #3a2416;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1724; --surface: #12233a; --ink: #e8eef5; --muted: #93a6ba; --line: #22374f;
  --accent: #ff7a3d; --accent-ink: #1a0d05; --win: #4cc48a; --soft: #1a2f49; --mine: #3a2416;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.45 var(--body);
  padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
}
.wrap { max-width: 560px; margin: 0 auto; padding-inline: 16px; }
.num { font-variant-numeric: tabular-nums; }

/* Fejléc */
header { padding-block: 20px 14px; }
.eyebrow { font: 600 13px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font: 800 clamp(34px, 10vw, 46px)/.95 var(--display); margin: 6px 0 10px; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
h1 span { color: var(--accent); }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.facts span { font: 600 13px/1 var(--body); background: var(--soft); border-radius: 999px; padding: 6px 10px; }
.status { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--win); flex: none; }
.dot.err { background: var(--accent); }
.status button { margin-left: auto; font: 600 13px var(--body); color: var(--ink); background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }

/* Kiemelt meccs */
.spot { background: var(--ink); color: var(--bg); border-radius: 16px; padding: 14px 16px 16px; margin-bottom: 14px; }
.spot .lbl { display: flex; justify-content: space-between; font: 600 12px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; opacity: .8; }
.spot .lbl b { color: var(--accent); opacity: 1; }
.spot .teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; margin-top: 12px; }
.spot .t { font: 700 20px/1.1 var(--display); text-transform: uppercase; min-width: 0; overflow-wrap: anywhere; }
.spot .t:last-child { text-align: right; }
.spot .sc { font: 800 34px/1 var(--display); }
.spot .stake { margin-top: 10px; font-size: 13px; opacity: .75; }

/* Fülek */
nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 8px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--soft); border-radius: 12px; padding: 4px; gap: 4px; }
.tabs button { font: 700 15px/1 var(--display); letter-spacing: .04em; text-transform: uppercase; border: 0; border-radius: 9px; padding: 10px 4px; background: transparent; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
.pick { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 14px; color: var(--muted); }
.pick select { flex: 1; min-width: 0; font: 500 15px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

main { padding-block: 6px 40px; }
h2 { font: 800 22px/1 var(--display); text-transform: uppercase; letter-spacing: .02em; margin: 22px 0 4px; }
.sub { font-size: 13px; color: var(--muted); margin: 0 0 10px; }

/* Meccslista */
.list { background: var(--surface); border-radius: 14px; overflow: hidden; }
.m { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 11px 12px; border-top: 1px solid var(--line); }
.m:first-child { border-top: 0; }
.m.mine { background: var(--mine); }
.m.now { box-shadow: inset 4px 0 0 var(--accent); }
.when { font: 700 16px/1.1 var(--display); }
.when small { display: block; font: 600 11px/1.3 var(--body); color: var(--muted); letter-spacing: .04em; }
.row { display: grid; grid-template-columns: 1fr 28px; gap: 8px; align-items: baseline; }
.row .n { min-width: 0; overflow-wrap: anywhere; }
.row .g { text-align: right; font: 700 18px/1.2 var(--display); }
.row.w .n { font-weight: 600; }
.row.w .g { color: var(--win); }
.ph { color: var(--muted); font-style: italic; }
.tag { font-size: 12px; color: var(--muted); margin-top: 3px; }

/* Tabellák */
.tbl { background: var(--surface); border-radius: 14px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { font: 600 11px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: center; padding: 10px 4px; }
th:nth-child(2) { text-align: left; }
td { text-align: center; padding: 9px 4px; border-top: 1px solid var(--line); }
td.tn { text-align: left; min-width: 120px; }
td.pos { width: 30px; white-space: nowrap;font: 700 15px var(--display); color: var(--muted); }
td.p { font: 800 17px var(--display); }
tr.mine td { background: var(--mine); }
.q { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }

/* Végeredmény */
.podium { background: var(--surface); border-radius: 14px; overflow: hidden; }
.pl { display: grid; grid-template-columns: 48px 1fr; align-items: center; gap: 10px; padding: 12px; border-top: 1px solid var(--line); }
.pl:first-child { border-top: 0; }
.pl .rk { font: 800 28px/1 var(--display); text-align: center; }
.pl .tn { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.pl .br { font-size: 12px; color: var(--muted); }
.pl.medal .rk { color: var(--accent); }
.pl.mine { background: var(--mine); }
.note { font-size: 13px; color: var(--muted); margin-top: 14px; }
.ceremony { margin-top: 18px; text-align: center; font: 700 18px/1.2 var(--display); text-transform: uppercase; letter-spacing: .03em; }
footer { font-size: 12px; color: var(--muted); padding-block: 0 30px; }
@media (prefers-reduced-motion: no-preference) { .dot.live { animation: pulse 2s infinite; } }
@keyframes pulse { 50% { opacity: .35; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Menetrend és élő eredmények</div>
    <h1>Floorball <span>Kupa</span></h1>
    <div class="facts"><span>9 csapat</span><span>24 meccs</span><span>15 perc</span><span>1 pálya</span><span>09:10–17:10</span></div>
    <div class="status"><span class="dot" id="dot"></span><span id="stamp">Betöltés…</span><button type="button" id="reload">Frissítés</button></div>
  </header>

  <section id="spot"></section>

  <nav>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tab-meccsek" data-tab="meccsek" aria-selected="true">Meccsek</button>
      <button type="button" role="tab" id="tab-tabellak" data-tab="tabellak" aria-selected="false">Tabellák</button>
      <button type="button" role="tab" id="tab-vegeredmeny" data-tab="vegeredmeny" aria-selected="false">Végeredmény</button>
    </div>
    <label class="pick" for="team">Csapatom: <select id="team"><option value="">nincs kiválasztva</option></select></label>
  </nav>

  <main>
    <div id="p-meccsek"></div>
    <div id="p-tabellak" hidden></div>
    <div id="p-vegeredmeny" hidden></div>
  </main>

  <footer>Az eredményeket a szervezők a helyszínen rögzítik, az oldal 30 másodpercenként magától frissül.</footer>
</div>

<script>
const SHEET_ID = "1fF216QfCj-1owzEvjVfQkF4BWlRJUbqYuBZFTyCUyAE";
// Minden a táblázat saját képleteiből jön, az oldal semmit nem számol újra.
// Külön tartományok, mert a gviz a vegyes típusú oszlopokban kinullázza a kisebbségi típust.
const csvUrl = range => `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&headers=0&gid=0&range=${range}`;
const RANGES = { matches: "B6:I36", tables: "K6:R35", final: "K38:P46" };
const REFRESH_MS = 30000;
const SLOT_MIN = 20;                       // 15 perc játék + 5 perc csere

// Tartalék: a menetrend a táblázat jelenlegi állapotából, ha nincs net.
const FALLBACK = [
 ["1.","A","9:10","Óbudai Egyetem","","","Fehérvári Makik","Alapszakasz A"],
 ["2.","B","9:30","B***ME*","","","Bokorulás","Alapszakasz B"],
 ["3.","C","9:50","II. Rákóczi Ferenc Gimnázium","","","Corvinus","Alapszakasz C"],
 ["4.","A","10:10","Fehérvári Makik","","","ELTE TREFORT","Alapszakasz A"],
 ["5.","B","10:30","Bokorulás","","","KFG","Alapszakasz B"],
 ["6.","C","10:50","Corvinus","","","Nyuggerek","Alapszakasz C"],
 ["7.","A","11:10","ELTE TREFORT","","","Óbudai Egyetem","Alapszakasz A"],
 ["8.","B","11:30","KFG","","","B***ME*","Alapszakasz B"],
 ["9.","C","11:50","Nyuggerek","","","II. Rákóczi Ferenc Gimnázium","Alapszakasz C"],
 ["10.","Kereszt","12:10","A2","","","B3","Győztes: D1 | Vesztes: E1"],
 ["11.","Kereszt","12:30","B2","","","C3","Győztes: D2 | Vesztes: E2"],
 ["12.","Kereszt","12:50","C2","","","A3","Győztes: D3 | Vesztes: E3"],
 ["13.","Kvali","13:10","C1","","","D1 (10. meccs győztese)","Győztes: G1 | Vesztes: F1"],
 ["14.","Kvali","13:30","A1","","","D2 (11. meccs győztese)","Győztes: G2 | Vesztes: F2"],
 ["15.","Kvali","13:50","B1","","","D3 (12. meccs győztese)","Győztes: G3 | Vesztes: F3"],
 ["16.","Alsóház (E)","14:10","E1","","","E2","7–9. helyért (E1 - E2)"],
 ["17.","Középház (F)","14:30","F1","","","F2","4–6. helyért (F1 - F2)"],
 ["18.","Döntő (G)","14:50","G1","","","G2","1–3. helyért (G1 - G2)"],
 ["19.","Alsóház (E)","15:10","E2","","","E3","7–9. helyért (E2 - E3)"],
 ["20.","Középház (F)","15:30","F2","","","F3","4–6. helyért (F2 - F3)"],
 ["21.","Döntő (G)","15:50","G2","","","G3","1–3. helyért (G2 - G3)"],
 ["22.","Alsóház (E)","16:10","E3","","","E1","7–9. helyért (E3 - E1)"],
 ["23.","Középház (F)","16:30","F3","","","F1","4–6. helyért (F3 - F1)"],
 ["24.","Döntő (G)","16:50","G3","","","G1","1–3. helyért (G3 - G1)"]
];

const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') q = false;
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (c !== "\r") cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}

// Helyőrző-e a csapatnév (pl. "A2", "D1 (10. meccs győztese)")
const isPlaceholder = n => /^[A-G]\d\b/.test(n.trim());
const goal = v => { const t = String(v).trim(); return t === "" || isNaN(+t) ? null : Math.round(+t); };

function toMatches(rows) {
  return rows.filter(r => /^\d+\.$/.test((r[0] || "").trim())).map(r => {
    const no = parseInt(r[0], 10);
    const phase = no <= 9 ? "alap" : no <= 15 ? "kozep" : "hely";
    let group = (r[1] || "").trim();
    const gm = group.match(/\(([EFG])\)/); if (gm) group = gm[1];
    const [h, m] = (r[2] || "").split(":").map(Number);
    return {
      no, phase, group, round: (r[1] || "").trim(),
      time: (r[2] || "").trim(), minutes: h * 60 + (m || 0),
      home: (r[3] || "").trim(), away: (r[6] || "").trim(),
      hg: goal(r[4]), ag: goal(r[5]), stake: (r[7] || "").trim()
    };
  });
}
const played = m => m.hg !== null && m.ag !== null;

// A táblázat K–R oszlopának csoporttáblái: "A CSOPORT" fejléc, alatta 3 sor (név, M, Gy, D, V, Gólok, GK, P).
function toTables(rows) {
  const out = {}; let cur = null; let note = "";
  for (const r of rows) {
    const k = (r[0] || "").trim();
    const h = k.match(/^([A-G]) CSOPORT/);
    if (h) { cur = out[h[1]] = []; continue; }
    if (/pontoz/i.test(k)) note = k.replace(/^\W+/, "");
    if (cur && k && cur.length < 3) {
      const n = i => { const v = +String(r[i] || "").trim(); return isNaN(v) ? 0 : v; };
      cur.push({ name: k, m: n(1), w: n(2), d: n(3), l: n(4), goals: (r[5] || "").replace(/\s/g, ""), gd: n(6), p: n(7) });
    } else if (!k) cur = null;
  }
  // Megjelenítési sorrend ugyanaz, mint a táblázat továbbjutási képletében: SORT(P csökkenő, GK csökkenő).
  for (const L in out) out[L] = out[L].map((s, i) => ({ ...s, i })).sort((a, b) => b.p - a.p || b.gd - a.gd || a.i - b.i);
  out.note = note;
  return out;
}
// Végső helyezés (K38:P46): helyezés-címke, csapat, ág.
const toFinal = rows => rows.filter(r => (r[0] || "").trim()).map(r => ({ label: r[0].trim(), team: (r[1] || "").trim(), branch: (r[5] || "").trim() }));
const finalPending = t => !t || /csoport \d\. helyezett/i.test(t);

let MATCHES = toMatches(FALLBACK);
let TABLES = {}, FINAL = [];
let lastOk = null, failed = false;
let tab = store.get("fk-tab") || "meccsek";
let mine = store.get("fk-team") || "";
const isMine = n => mine && n === mine;

function teamCell(name, g, win) {
  const ph = isPlaceholder(name);
  return `<div class="row${win ? " w" : ""}"><span class="n${ph ? " ph" : ""}">${esc(ph ? phLabel(name) : name)}</span><span class="g num">${g === null ? "" : g}</span></div>`;
}
function phLabel(n) {
  const m = n.match(/^([A-G])(\d)/); if (!m) return n;
  const [, L, k] = m;
  if ("ABC".includes(L)) return `${L} csoport ${k}. helyezett`;
  if (L === "D") return n.replace(/^D\d\s*/, "").replace(/[()]/g, "") || `Keresztjáték ${k}. győztese`;
  const src = { E: "keresztjáték vesztese", F: "kvali vesztese", G: "kvali győztese" }[L];
  return `${k}. ${src}`;
}

function nowMinutes() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function liveMatch() {
  const n = nowMinutes();
  // Csak a torna napján: ha még egy eredmény sincs, a 9:10-es nyitómeccs után nem jelölünk élőt.
  if (!MATCHES.some(played) && n > MATCHES[0].minutes + SLOT_MIN) return null;
  return MATCHES.find(m => !played(m) && n >= m.minutes && n < m.minutes + SLOT_MIN);
}

function renderSpot() {
  const live = liveMatch();
  const next = live || MATCHES.find(m => !played(m));
  const el = $("spot");
  if (!next) { el.innerHTML = `<div class="spot"><div class="lbl"><b>Vége a tornának</b></div><div class="stake">Eredményhirdetés és díjátadó 17:10-kor. A végeredményt a harmadik fülön találod.</div></div>`; return; }
  const name = n => esc(isPlaceholder(n) ? phLabel(n) : n);
  el.innerHTML = `<div class="spot">
    <div class="lbl"><b>${live ? "● Most a pályán" : "Következő meccs"}</b><span>${next.no}. meccs · ${esc(next.time)}</span></div>
    <div class="teams"><div class="t">${name(next.home)}</div><div class="sc">–</div><div class="t">${name(next.away)}</div></div>
    <div class="stake">${esc(next.round)} · ${esc(next.stake)}</div></div>`;
}

function matchList(ms) {
  const live = liveMatch();
  return `<div class="list">${ms.map(m => {
    const p = played(m);
    const cls = ["m", (isMine(m.home) || isMine(m.away)) ? "mine" : "", live && live.no === m.no ? "now" : ""].join(" ");
    return `<div class="${cls}">
      <div class="when num">${esc(m.time)}<small>${m.no}.</small></div>
      <div>${teamCell(m.home, m.hg, p && m.hg > m.ag)}${teamCell(m.away, m.ag, p && m.ag > m.hg)}
      <div class="tag">${esc(m.round)} · ${esc(m.stake)}</div></div></div>`;
  }).join("")}</div>`;
}

function renderMatches() {
  const by = ph => MATCHES.filter(m => m.phase === ph);
  $("p-meccsek").innerHTML = `
    <h2>Alapszakasz</h2><p class="sub">Három 3 csapatos csoport, mindenki mindenkivel.</p>${matchList(by("alap"))}
    <h2>Keresztjáték és kvalifikáció</h2><p class="sub">A csoportok 2–3. helyezettjei keresztben játszanak, a győztesek a csoportelsőkkel kvalifikálnak.</p>${matchList(by("kozep"))}
    <h2>Helyosztók</h2><p class="sub">Három hármas csoport: döntő (1–3.), középház (4–6.), alsóház (7–9.).</p>${matchList(by("hely"))}
    <p class="ceremony">17:10 · Eredményhirdetés és díjátadó</p>`;
}

function table(title, sub, rows, marks) {
  if (!rows || !rows.length) return `<h2>${title}</h2><p class="sub">Betöltés…</p>`;
  return `<h2>${title}</h2>${sub ? `<p class="sub">${sub}</p>` : ""}<div class="tbl"><table class="num">
    <thead><tr><th></th><th>Csapat</th><th>M</th><th>Gy</th><th>D</th><th>V</th><th>Gól</th><th>GK</th><th>P</th></tr></thead><tbody>
    ${rows.map((s, i) => `<tr class="${isMine(s.name) ? "mine" : ""}"><td class="pos">${marks ? `<span class="q" style="background:${marks[i]}"></span>` : ""}${i + 1}</td>
      <td class="tn${isPlaceholder(s.name) ? " ph" : ""}">${esc(isPlaceholder(s.name) ? phLabel(s.name) : s.name)}</td>
      <td>${s.m}</td><td>${s.w}</td><td>${s.d}</td><td>${s.l}</td><td>${esc(s.goals)}</td><td>${s.gd > 0 ? "+" : ""}${s.gd}</td><td class="p">${s.p}</td></tr>`).join("")}
    </tbody></table></div>`;
}

function renderTables() {
  const T = TABLES;
  const marks = ["var(--win)", "var(--accent)", "var(--accent)"];
  $("p-tabellak").innerHTML = `
    ${["A", "B", "C"].map(L => table(`${L} csoport`, "", T[L], marks)).join("")}
    <div class="legend"><span><span class="q" style="background:var(--win)"></span>csoportelső → kvalifikáció</span><span><span class="q" style="background:var(--accent)"></span>2–3. hely → keresztjáték</span></div>
    ${table("Döntő csoport", "1–3. helyért", T.G)}
    ${table("Középház", "4–6. helyért", T.F)}
    ${table("Alsóház", "7–9. helyért", T.E)}
    ${T.note ? `<p class="note">${esc(T.note)}</p>` : ""}`;
}

function renderFinal() {
  const html = FINAL.length ? FINAL.map((f, i) => {
    const rank = i + 1, known = !finalPending(f.team);
    return `<div class="pl${rank <= 3 ? " medal" : ""}${known && isMine(f.team) ? " mine" : ""}"><div class="rk num">${rank}.</div>
      <div><div class="tn${known ? "" : " ph"}">${known ? esc(f.team) : "még nem dőlt el"}</div><div class="br">${esc(f.branch)}</div></div></div>`;
  }).join("") : `<div class="pl"><div></div><div class="tn ph">Betöltés…</div></div>`;
  $("p-vegeredmeny").innerHTML = `<h2>Végeredmény</h2><p class="sub">A szervezők táblázatából, amint egy helyosztó csoport lezárult.</p><div class="podium">${html}</div>
    <p class="ceremony">17:10 · Eredményhirdetés és díjátadó</p>`;
}

function renderTeamPicker() {
  const names = new Set();
  MATCHES.filter(m => m.phase === "alap").forEach(m => { names.add(m.home); names.add(m.away); });
  const sel = $("team");
  const opts = [...names].sort((a, b) => a.localeCompare(b, "hu"));
  sel.innerHTML = `<option value="">nincs kiválasztva</option>` + opts.map(n => `<option${n === mine ? " selected" : ""}>${esc(n)}</option>`).join("");
}

function renderStatus() {
  const dot = $("dot"), st = $("stamp");
  if (failed) {
    dot.className = "dot err";
    st.textContent = lastOk ? `Nincs kapcsolat · utolsó adat ${lastOk}` : "Nincs kapcsolat · az alap menetrend látszik";
  } else if (lastOk) {
    dot.className = "dot live"; st.textContent = `Élő · frissítve ${lastOk}`;
  }
}

function render() {
  renderSpot(); renderMatches(); renderTables(); renderFinal(); renderStatus();
  for (const b of document.querySelectorAll(".tabs button")) b.setAttribute("aria-selected", b.dataset.tab === tab);
  for (const id of ["meccsek", "tabellak", "vegeredmeny"]) $("p-" + id).hidden = id !== tab;
}

async function load() {
  try {
    const get = async range => {
      const res = await fetch(csvUrl(range) + "&t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      return parseCSV(await res.text());
    };
    const [m, t, f] = await Promise.all([get(RANGES.matches), get(RANGES.tables), get(RANGES.final)]);
    const ms = toMatches(m), tb = toTables(t), fi = toFinal(f);
    if (ms.length < 24 || fi.length < 9) throw new Error("hiányos adat");
    MATCHES = ms; TABLES = tb; FINAL = fi; failed = false;
    lastOk = new Date().toLocaleTimeString("hu-HU", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    store.set("fk-cache2", JSON.stringify({ ms, tb, fi, lastOk }));
  } catch (e) {
    failed = true;
  }
  render();
}

// Indítás: előbb a gyorsítótárból, aztán élőben.
try { const c = JSON.parse(store.get("fk-cache2") || "null"); if (c && c.ms) { MATCHES = c.ms; TABLES = c.tb || {}; FINAL = c.fi || []; lastOk = c.lastOk; } } catch {}
renderTeamPicker(); render(); load();
setInterval(load, REFRESH_MS);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
$("reload").addEventListener("click", load);
document.querySelector(".tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  tab = b.dataset.tab; store.set("fk-tab", tab); render(); window.scrollTo({ top: $("spot").offsetTop, behavior: "smooth" });
});
$("team").addEventListener("change", e => { mine = e.target.value; store.set("fk-team", mine); render(); });
</script>
</body>
</html>
